<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>התיבה האנונימית</title>

<style>
:root{
  --bg:#0b1220;
  --card:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.12);
  --text:#eaf0ff;
  --muted:#a9b4c7;
  --primary:#4f8cff;
  --success:#3ddc97;
  --error:#ff5c7a;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at top,#182a4a,#0b1220);
  color:var(--text);
  font-family:system-ui;
  padding:20px;
}

.card{
  width:100%;
  max-width:520px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  backdrop-filter: blur(12px);
}

h1{font-size:1.5rem;margin-bottom:6px;}
p{color:var(--muted);margin-bottom:16px;line-height:1.5;}

textarea{
  width:100%;
  min-height:150px;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(0,0,0,0.3);
  color:white;
  font-size:15px;
}

button{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--primary);
  color:white;
  font-weight:600;
  cursor:pointer;
}

button:disabled{
  opacity:0.6;
}

.message{
  margin-top:12px;
  text-align:center;
  min-height:20px;
}

.success{color:var(--success);}
.error{color:var(--error);}
</style>
</head>

<body>

<div class="card">
  <h1>התיבה האנונימית</h1>

  <p>
    מתביישים לשאול משהו בקהילה?<br />
    ספרו לנו מה מעניין אתכם ונשאל במקומכם
  </p>

  <form id="form">
    <textarea id="question" placeholder="מה לשאול בקהילה?" required></textarea>

    <button id="btn" type="submit">שליחה</button>

    <div id="msg" class="message"></div>
  </form>
</div>

<script>
const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxg21tRytdeUPyNgCwA2XVdMwEpH2rcDwNkq1yCbOIpzCvEbGy9N_qt8frTz8zJPcT2/exec";

const form = document.getElementById("form");
const textarea = document.getElementById("question");
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const question = textarea.value.trim();
  if (!question) return;

  btn.disabled = true;
  btn.textContent = "שולח...";

  msg.textContent = "";
  msg.className = "message";

  try {
    const params = new URLSearchParams();
    params.append("question", question);

    const res = await fetch(WEB_APP_URL, {
      method: "POST",
      body: params
    });

    const data = await res.json();

    if (!data.success) {
      throw new Error(data.error || "failed");
    }

    textarea.value = "";
    msg.textContent = "קלטנו בהצלחה את השאלה שלך!";
    msg.classList.add("success");
  
  } catch (err) {
    console.error(err);
    msg.textContent = "אופס... יש לנו שגיאה, תפתחו לנו באג?";
    msg.classList.add("error");
  }
  
  btn.disabled = false;
  btn.textContent = "שליחה";
});

</script>
</body>
</html>
